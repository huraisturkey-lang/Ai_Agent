AWSTemplateFormatVersion: '2010-09-09'
Description: >
  GitHub Actions OIDC role for CI/CD deployments.
  Allows the deploy workflow to push images to ECR and update ECS services.

Parameters:
  GitHubOrg:
    Type: String
    Default: huraisturkey-lang
    Description: GitHub organization or username

  GitHubRepo:
    Type: String
    Default: Ai_Agent
    Description: GitHub repository name

  OIDCProviderArn:
    Type: String
    Default: ""
    Description: >
      ARN of existing GitHub OIDC provider. Leave empty to create one.
      If you already have one in the account, paste the ARN here.

Conditions:
  CreateOIDCProvider: !Equals [!Ref OIDCProviderArn, ""]

Resources:

  # ── GitHub OIDC Identity Provider (one per account) ────────────────────────
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
      Tags:
        - Key: Purpose
          Value: github-actions-cicd

  # ── IAM Role assumed by GitHub Actions ─────────────────────────────────────
  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-deploy-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOIDCProvider
                - !Ref GitHubOIDCProvider
                - !Ref OIDCProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:*"
      Policies:
        - PolicyName: ECRPushAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/data-architecture-ai"

        - PolicyName: ECSDeployAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:ListTasks
                  - ecs:DescribeTasks
                Resource: "*"
                Condition:
                  StringEquals:
                    ecs:cluster: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/data-architecture-ai"

        - PolicyName: CloudFormationReadAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/cgs-ai-analyst-agent-project/*"
      Tags:
        - Key: Purpose
          Value: github-actions-cicd

Outputs:
  DeployRoleArn:
    Description: >
      Add this ARN as the GitHub secret AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubActionsDeployRole.Arn

  SetupCommand:
    Description: Command to add the secret to GitHub
    Value: !Sub |
      gh secret set AWS_DEPLOY_ROLE_ARN --body "${GitHubActionsDeployRole.Arn}"
